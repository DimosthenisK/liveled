<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111">
  <title>LiveLED</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <h1>LiveLED</h1>
    <p id="status">Not connected</p>
    <button id="connect" type="button">Connect</button>
    <label>Color <input id="color" type="color" value="#ffffff"></label>
    <label>Brightness <input id="brightness" type="range" min="0" max="100" value="100"></label>
    <button id="clear" type="button">Clear</button>
    <button id="erase" type="button" aria-pressed="false">Draw</button>
  </header>
  <canvas id="board" width="8" height="8" aria-label="8 by 8 LED matrix"></canvas>
  <script src="app.js"></script>
</body>
</html>
